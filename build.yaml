framework: "net10.0"
overview: "Sync your ListenBrainz Weekly Jams playlist into Jellyfin"
description: >
  Keeps a rolling Jellyfin playlist in sync with the Weekly Jams playlist
  that ListenBrainz generates from your listening history every week. Tracks
  are matched by MusicBrainz recording ID first, with an artist/title
  fallback, and tracks missing from your library are reported in the server
  log. Sync runs as a scheduled task (default: daily).
category: "Music"
owner: "tabjy"
artifacts:
  - "Jellyfin.Plugin.ListenBrainzWeeklyJams.dll"
changelog: >
  First working release, integration-tested on a production Jellyfin 12.2
  server. Syncs the latest ListenBrainz Weekly Jams playlist into a rolling
  Jellyfin playlist via a daily scheduled task: MusicBrainz recording-ID
  matching with artist/title fallback, immutable-playlist short-circuit
  (unchanged weeks cost one API call), zero-match guard, in-place refresh
  that preserves user renames, and missing-track reporting in the server log.
