targetAbi: "12.0.0.0"
framework: "net10.0"
overview: "Sync your ListenBrainz Weekly Jams playlist into Jellyfin"
description: >
  Keeps a rolling Jellyfin playlist in sync with the Weekly Jams playlist
  that ListenBrainz generates from your listening history every week. Tracks
  are matched by MusicBrainz recording ID first, with an artist/title
  fallback, and tracks missing from your library are reported in the server
  log. Sync runs as a scheduled task (default: daily).
category: "Music"
owner: "tabjy"
artifacts:
  - "Jellyfin.Plugin.ListenBrainzWeeklyJams.dll"
changelog: >
  New: optional last-week playlist. Enable "Also sync last week's jams" in
  the plugin configuration to maintain a second playlist with the previous
  week's jams — the second-newest created-for-you playlist, matching the
  ListenBrainz website's interpretation (entries can appear seconds apart
  when ListenBrainz catches up under load). Last-week syncing has its own
  change detection and zero-match guard, and an expired previous week
  keeps the current playlist contents.
